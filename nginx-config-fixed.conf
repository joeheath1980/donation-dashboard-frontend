server {
    listen 443 ssl;
    server_name do-nation.space www.do-nation.space;

    # SSL configuration
    ssl_certificate /etc/letsencrypt/live/do-nation.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/do-nation.space/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Dedicated block for SSE endpoints (e.g., email status stream)
    location /api/email/status-stream/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        
        # Disable buffering and extend timeouts for SSE
        proxy_buffering off;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    # Reverse proxy for other backend API calls
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0';
    }

    # Serve the static files for your frontend
    root /var/www/donation-dashboard/build;
    index index.html;

    # Don't cache service worker
    location = /service-worker.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Don't cache index.html
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Cache static assets with hash in filename for 1 year
    location ~* \.[a-f0-9]{8}\.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache other static assets for 1 hour
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # For single-page applications, fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name do-nation.space www.do-nation.space;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}