# Secure Nginx Configuration for Do-Nation
# This configuration includes comprehensive security headers and protections

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
    listen 443 ssl http2;
    server_name do-nation.space www.do-nation.space;

    # SSL configuration
    ssl_certificate /etc/letsencrypt/live/do-nation.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/do-nation.space/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Content Security Policy - adjust as needed for your application
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://apis.google.com https://www.gstatic.com https://www.google.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://api.stripe.com https://do-nation.space wss://do-nation.space; frame-src 'self' https://accounts.google.com https://www.google.com;" always;
    
    # Remove server version
    server_tokens off;
    
    # Client body size limits (10MB for file uploads)
    client_max_body_size 10m;
    client_body_buffer_size 128k;
    
    # Connection limits
    limit_conn conn_limit 20;

    # Dedicated block for SSE endpoints with specific limits
    location /api/email/status-stream/ {
        # Lower rate limit for SSE connections
        limit_req zone=api_limit burst=5 nodelay;
        limit_conn conn_limit 5;
        
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        
        # SSE specific settings
        proxy_buffering off;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
        proxy_cache off;
        
        # Security headers for SSE
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control 'no-cache, no-store, must-revalidate' always;
    }

    # Authentication endpoints with stricter rate limiting
    location ~ ^/api/(auth|users/login|users/register|charities/signup|businesses/signup) {
        limit_req zone=login_limit burst=2 nodelay;
        
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        
        # No caching for auth endpoints
        add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0' always;
    }

    # General API endpoints with standard rate limiting
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        
        # Security headers for API
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0' always;
    }

    # Serve the static files for your frontend
    root /var/www/donation-dashboard;
    index index.html;

    # Cache static assets with security headers
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        # For hashed files (containing dots before extension), cache for 1 year
        location ~* \.[a-f0-9]{8}\.(js|css)$ {
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
        }
        
        # For non-hashed static files, cache for 1 hour
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Don't cache HTML files
    location ~* \.(html)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # For single-page applications, fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
        
        # Don't cache index.html
        location = /index.html {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            add_header X-Content-Type-Options "nosniff" always;
        }
    }

    # Block access to hidden files and directories
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block access to backup and source files
    location ~* \.(bak|config|sql|fla|psd|ini|log|sh|inc|swp|dist|git|gitignore)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Custom error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /404.html {
        internal;
    }
    
    location = /50x.html {
        internal;
    }
}

# HTTP to HTTPS redirect with HSTS
server {
    listen 80;
    server_name do-nation.space www.do-nation.space;

    # Add HSTS even on redirect
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    
    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}